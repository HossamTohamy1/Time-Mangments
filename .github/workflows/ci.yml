name: ci

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Client - install
        working-directory: frontend
        run: npm ci

      - name: Client - lint + i18n parity
        working-directory: frontend
        run: npm run lint

      - name: Client - unit tests
        working-directory: frontend
        run: npm test

      - name: Client - production build into backend wwwroot
        working-directory: frontend
        run: npm run build:prod

      - name: Server - restore + build
        working-directory: backend
        run: |
          dotnet restore Timetable.sln
          dotnet build Timetable.sln -c Release --no-restore

      - name: Server - tests
        working-directory: backend
        run: dotnet test Timetable.sln -c Release --no-build --logger trx

      - name: Publish single deployable app
        working-directory: backend
        run: dotnet publish src/Timetable.Api/Timetable.Api.csproj -c Release -o ../artifacts/publish -p:SkipClientBuild=true

      - name: Verify SPA hosting (index, deep link, API 404 JSON)
        run: |
          cd artifacts/publish
          ASPNETCORE_URLS=http://localhost:5199 Database__ApplyMigrationsOnStartup=false dotnet Timetable.Api.dll &
          for i in $(seq 1 30); do curl -sf http://localhost:5199/health && break; sleep 1; done
          cd ../../frontend && node scripts/verify-build.mjs http://localhost:5199

      - uses: actions/upload-artifact@v4
        with:
          name: timetable-app
          path: artifacts/publish
